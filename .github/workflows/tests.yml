name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  matlab:
    if: ${{ !github.event.repository.private || vars.RUN_MATLAB_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: setup; results = runtests('tests'); disp(table(results)); assertSuccess(results);
